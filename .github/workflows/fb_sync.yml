name: Facebook Auto-Poster Sync

on:
  schedule:
    # Runs automatically every 3 hours (8 times per day x 3 vehicles = max 24 per day)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install @supabase/supabase-js

      - name: Run FB Auto Poster
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://tdsipiltwajwhzgjsupx.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY || 'sb_publishable_hkEU-TniEPk-ShSxBZQ-kQ_zGrDUC8w' }}
        run: node scripts/fb_inventory_sync.js
