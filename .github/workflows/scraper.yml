name: AutoLaunch Scraper Runner

on:
  schedule:
    # Runs automatically once a day at 11:17 UTC (6:17 AM EST / 7:17 AM EDT).
    # Daily cadence per Matthew (2026-11-07): dealer inventory turns over
    # daily; on-demand syncs still dispatch runs any time.
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      user_id:
        description: 'User UUID to crawl for'
        required: true
        default: '40a95557-504a-460f-a891-462bb2b4f25c'

concurrency:
  group: autolaunch-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright supabase
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USER_ID: ${{ github.event.inputs.user_id || '40a95557-504a-460f-a891-462bb2b4f25c' }}
        run: python luna-rebuild/scraper.py
