name: AutoLaunch Scraper Runner

on:
  schedule:
    # Runs automatically every 2 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger directly from GitHub UI or API webhook

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase nest-asyncio
          playwright install --with-deps chromium

      - name: Run AutoLaunch Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://tdsipiltwajwhzgjsupx.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_hkEU-TniEPk-ShSxBZQ-kQ_zGrDUC8w' }}
          DEALERSHIP_ID: 'moses'
        run: python scraper.py
