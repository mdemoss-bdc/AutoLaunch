name: AutoLaunch Scraper Runner

on:
  schedule:
    # Runs automatically every night at 06:00 UTC (2:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      user_id:
        description: 'User UUID to crawl for'
        required: true
        default: '40a95557-504a-460f-a891-462bb2b4f25c'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright supabase
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USER_ID: ${{ github.event.inputs.user_id || '40a95557-504a-460f-a891-462bb2b4f25c' }}
        run: python scraper.py
