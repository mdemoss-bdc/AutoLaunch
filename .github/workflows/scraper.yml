name: AutoLaunch Scraper Runner

on:
  schedule:
    # Runs automatically every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright supabase nest-asyncio

      - name: Install Playwright Chromium & System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Execute Scraper
        env:
          SUPABASE_URL: "https://tdsipiltwajwhzgjsupx.supabase.co"
          SUPABASE_KEY: "sb_publishable_hkEU-TniEPk-ShSxBZQ-kQ_zGrDUC8w"
          DEALERSHIP_ID: "moses"
        run: |
          python scraper.py
