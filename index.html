<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoLaunch Pro | Dealership Sales & Marketing Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(23, 32, 54, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .glass-card:hover { transform: translateY(-4px); border-color: rgba(99, 102, 241, 0.4); box-shadow: 0 12px 24px -10px rgba(99, 102, 241, 0.2); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- SaaS Navigation Bar -->
  <header class="glass-panel sticky top-0 z-40 border-b border-gray-800 px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-bolt-lightning text-white text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-gray-200 to-indigo-300 bg-clip-text text-transparent">AutoLaunch<span class="text-indigo-400">Pro</span></span>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 uppercase tracking-wider">Multi-Tenant B2B</span>
          </div>
        </div>
      </div>

      <!-- Controls & Polling Indicator -->
      <div class="flex items-center gap-3">
        <div id="liveStatusBadge" class="flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="syncText">Supabase Live</span>
        </div>
        <button onclick="fetchLiveInventoryFromSupabase(true)" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold flex items-center gap-2 transition shadow-sm">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>Sync Now</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Dashboard -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-8 space-y-6">
    
    <!-- Top Lot Metrics Banner -->
    <div class="glass-panel p-6 rounded-2xl border border-gray-800 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-6">
      <div>
        <div class="flex items-center gap-3 mb-1">
          <h1 class="text-2xl font-bold text-white tracking-tight">Moses Automotive Group</h1>
          <span id="activeLotsCountBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Scanning Rooftops...</span>
        </div>
        <p class="text-sm text-gray-400">Universal lot inventory auto-refreshing in real time from Supabase.</p>
      </div>

      <div class="flex items-center gap-4">
        <div class="px-5 py-3 rounded-xl bg-gray-900/60 border border-gray-800 text-center">
          <div class="text-[11px] font-medium text-gray-400 uppercase tracking-wider">Live Inventory</div>
          <div id="lotCount" class="text-2xl font-black text-indigo-400">Loading...</div>
        </div>
        <div class="px-5 py-3 rounded-xl bg-gray-900/60 border border-gray-800 text-center">
          <div class="text-[11px] font-medium text-gray-400 uppercase tracking-wider">Average Price</div>
          <div id="avgPrice" class="text-2xl font-black text-emerald-400">--</div>
        </div>
      </div>
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="glass-panel p-4 rounded-xl border border-gray-800 space-y-4">
      <div class="flex flex-col md:flex-row gap-3">
        <div class="flex-1 relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Search by Year, Make, Model, VIN, or Location..." class="w-full bg-gray-950/70 border border-gray-800 rounded-lg pl-10 pr-4 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-indigo-500">
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <!-- Dynamic Location Dropdown -->
          <select id="locationFilter" onchange="applyFilters()" class="bg-gray-950/70 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-indigo-500">
            <option value="ALL">All Rooftops / Locations</option>
          </select>
          <select id="conditionFilter" onchange="applyFilters()" class="bg-gray-950/70 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-indigo-500">
            <option value="ALL">All Conditions</option>
            <option value="Used" selected>Used Only</option>
            <option value="New">New Only</option>
          </select>
          <select id="sortSelect" onchange="applyFilters()" class="bg-gray-950/70 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-indigo-500">
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="miles_asc">Mileage: Lowest First</option>
            <option value="year_desc">Year: Newest First</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Vehicle Card Grid -->
    <div id="inventoryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <!-- Sales Modal: Quick Share / FB / TikTok -->
  <div id="actionModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-panel w-full max-w-xl rounded-2xl border border-gray-800 p-6 space-y-5">
      <div class="flex items-center justify-between border-b border-gray-800 pb-4">
        <div>
          <h3 id="modalTitle" class="text-lg font-bold text-white">Share Vehicle</h3>
          <p id="modalSubtitle" class="text-xs text-gray-400"></p>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div id="modalBody" class="space-y-4">
        <!-- Content dynamic -->
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://tdsipiltwajwhzgjsupx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hkEU-TniEPk-ShSxBZQ-kQ_zGrDUC8w";

    let rawInventory = [];
    const FALLBACK_IMAGE = "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600&auto=format&fit=crop&q=60";

    async function fetchLiveInventoryFromSupabase(isManual = false) {
      const lotBadge = document.getElementById("lotCount");
      const statusBadge = document.getElementById("syncText");
      if (isManual) statusBadge.innerText = "Syncing...";

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/scraped_inventory?select=*&is_active=eq.true&order=price.asc`, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Range": "0-1999"
          }
        });

        if (!response.ok) throw new Error("Database fetch error");

        const data = await response.json();
        if (Array.isArray(data)) {
          rawInventory = data;
          lotBadge.innerText = `${data.length} In-Stock`;
          
          const prices = data.map(c => c.price).filter(p => p && p > 0);
          if (prices.length > 0) {
            const avg = Math.round(prices.reduce((a, b) => a + b, 0) / prices.length);
            document.getElementById("avgPrice").innerText = `$${avg.toLocaleString()}`;
          }

          statusBadge.innerText = `Live (${data.length} Cars)`;
          populateLocations(data);
          applyFilters();
        }
      } catch (err) {
        console.error("Fetch error:", err);
        statusBadge.innerText = "Sync Failed";
      }
    }

    // Dynamically builds the location filter from all distinct rooftop locations in the DB
    function populateLocations(cars) {
      const locationSelect = document.getElementById("locationFilter");
      const currentSelected = locationSelect.value;
      const uniqueLocations = Array.from(new Set(cars.map(c => c.location_name).filter(Boolean))).sort();
      
      document.getElementById("activeLotsCountBadge").innerText = `${uniqueLocations.length} Active Rooftops`;

      let options = `<option value="ALL">All Rooftops (${uniqueLocations.length} Locations)</option>`;
      uniqueLocations.forEach(loc => {
        const count = cars.filter(c => c.location_name === loc).length;
        options += `<option value="${loc}" ${currentSelected === loc ? 'selected' : ''}>${loc} (${count})</option>`;
      });
      locationSelect.innerHTML = options;
    }

    function applyFilters() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const locationFilter = document.getElementById("locationFilter").value;
      const cond = document.getElementById("conditionFilter").value;
      const sort = document.getElementById("sortSelect").value;

      let filtered = rawInventory.filter(car => {
        const title = `${car.year} ${car.make} ${car.model} ${car.trim || ''} ${car.vin || ''} ${car.location_name || ''}`.toLowerCase();
        const matchesQuery = title.includes(query);
        const matchesLocation = locationFilter === "ALL" || (car.location_name || "Moses Auto Mall") === locationFilter;
        const matchesCond = cond === "ALL" || (car.condition || "Used") === cond;
        return matchesQuery && matchesLocation && matchesCond;
      });

      filtered.sort((a, b) => {
        if (sort === "price_asc") return (a.price || 0) - (b.price || 0);
        if (sort === "price_desc") return (b.price || 0) - (a.price || 0);
        if (sort === "miles_asc") return (a.mileage || 0) - (b.mileage || 0);
        if (sort === "year_desc") return (b.year || 0) - (a.year || 0);
        return 0;
      });

      renderGrid(filtered);
    }

    function renderGrid(cars) {
      const grid = document.getElementById("inventoryGrid");
      if (!cars.length) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No vehicles match your active search filters.</div>`;
        return;
      }

      grid.innerHTML = cars.map(car => {
        const photoUrl = car.image_url || FALLBACK_IMAGE;
        return `
        <div class="glass-card rounded-2xl overflow-hidden flex flex-col justify-between">
          <div>
            <div class="h-44 w-full bg-gray-900 relative overflow-hidden flex items-center justify-center">
              <img src="${photoUrl}" onerror="this.src='${FALLBACK_IMAGE}'" alt="Car" class="object-cover w-full h-full opacity-90 hover:opacity-100 transition duration-300">
              <div class="absolute top-3 left-3 flex gap-1.5">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">${car.condition || 'Used'}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">${car.status || 'Available'}</span>
              </div>
              <div class="absolute bottom-2 right-2 text-xs font-semibold px-2 py-1 rounded-md bg-black/70 text-white">
                ~$${Math.round((car.price || 15000) / 72)}/mo
              </div>
            </div>

            <div class="p-4 space-y-2">
              <div class="flex items-baseline justify-between">
                <span class="text-xl font-black text-white">$${(car.price || 0).toLocaleString()}</span>
                <span class="text-xs font-medium text-gray-400">${(car.mileage || 0).toLocaleString()} mi</span>
              </div>
              <h4 class="font-bold text-gray-100 text-sm truncate">${car.year} ${car.make} ${car.model} ${car.trim || ''}</h4>
              <p class="text-xs text-gray-400 truncate"><i class="fa-solid fa-location-dot text-indigo-400 mr-1"></i>${car.location_name || 'Moses Auto Mall'}</p>
              <p class="text-[11px] font-mono text-gray-500">VIN: ${car.vin || 'N/A'}</p>
            </div>
          </div>

          <div class="p-4 pt-0 grid grid-cols-3 gap-2">
            <button onclick='openShareModal(${JSON.stringify(car).replace(/'/g, "&apos;")})' class="py-2 px-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-semibold flex items-center justify-center gap-1 transition">
              <i class="fa-solid fa-share-nodes text-indigo-400"></i>
              <span>Share</span>
            </button>
            <button onclick='openFBModal(${JSON.stringify(car).replace(/'/g, "&apos;")})' class="py-2 px-2 rounded-lg bg-indigo-950/60 hover:bg-indigo-900/60 border border-indigo-700/40 text-indigo-200 text-xs font-semibold flex items-center justify-center gap-1 transition">
              <i class="fa-brands fa-facebook text-blue-400"></i>
              <span>FB Ad</span>
            </button>
            <button onclick='openTikTokModal(${JSON.stringify(car).replace(/'/g, "&apos;")})' class="py-2 px-2 rounded-lg bg-rose-950/50 hover:bg-rose-900/50 border border-rose-700/40 text-rose-200 text-xs font-semibold flex items-center justify-center gap-1 transition">
              <i class="fa-brands fa-tiktok text-rose-400"></i>
              <span>Video</span>
            </button>
          </div>
        </div>
      `;
      }).join('');
    }

    function openShareModal(car) {
      document.getElementById("modalTitle").innerText = "Customer Quick-Share";
      document.getElementById("modalSubtitle").innerText = `${car.year} ${car.make} ${car.model} | $${(car.price || 0).toLocaleString()}`;
      const msg = `Hey! Check out this ${car.year} ${car.make} ${car.model} at ${car.location_name || 'our lot'}: $${(car.price || 0).toLocaleString()} with ${(car.mileage || 0).toLocaleString()} miles. VIN: ${car.vin}. Let me know if you want to take it for a spin!`;

      document.getElementById("modalBody").innerHTML = `
        <div class="space-y-3">
          <label class="text-xs font-bold text-gray-400 uppercase">Pre-Formatted Message</label>
          <textarea id="shareText" class="w-full h-28 bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-gray-200">${msg}</textarea>
          <div class="flex gap-2">
            <button onclick="navigator.clipboard.writeText(document.getElementById('shareText').value); alert('Copied to clipboard!')" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white text-xs font-bold">Copy Text</button>
            <a href="sms:?&body=${encodeURIComponent(msg)}" class="flex-1 py-2 text-center rounded-lg bg-emerald-600 text-white text-xs font-bold">Open SMS</a>
          </div>
        </div>
      `;
      document.getElementById("actionModal").classList.remove("hidden");
    }

    function openFBModal(car) {
      document.getElementById("modalTitle").innerText = "Facebook Marketplace Listing Copy";
      document.getElementById("modalSubtitle").innerText = `${car.year} ${car.make} ${car.model}`;
      const fbCopy = `🔥 ${car.year} ${car.make} ${car.model} ${car.trim || ''} 🔥\n\nPrice: $${(car.price || 0).toLocaleString()}\nMileage: ${(car.mileage || 0).toLocaleString()}\nLocation: ${car.location_name || 'Moses Auto Mall'}\nStatus: Inspected & Front-Line Ready\n\n✅ Fully inspected by certified technicians\n✅ Financing available for all credit types\n✅ Trade-ins welcome!\n\nMessage me directly for details or to schedule a test drive!`;

      document.getElementById("modalBody").innerHTML = `
        <div class="space-y-3">
          <textarea id="fbText" class="w-full h-40 bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-gray-200">${fbCopy}</textarea>
          <button onclick="navigator.clipboard.writeText(document.getElementById('fbText').value); alert('Marketplace copy copied!')" class="w-full py-2 rounded-lg bg-blue-600 text-white text-xs font-bold">Copy Marketplace Text</button>
        </div>
      `;
      document.getElementById("actionModal").classList.remove("hidden");
    }

    function openTikTokModal(car) {
      document.getElementById("modalTitle").innerText = "TikTok / Reel 15-Second Script";
      document.getElementById("modalSubtitle").innerText = `${car.year} ${car.make} ${car.model}`;
      const script = `(Hook - 0-3s): Stop scrolling if you're looking for a reliable ride under $${Math.round(((car.price || 15000) * 1.1) / 1000)}k.\n(Body - 3-10s): This ${car.year} ${car.make} ${car.model} just landed at ${car.location_name || 'our lot'} with ${(car.mileage || 0).toLocaleString()} miles.\n(CTA - 10-15s): Clean title, inspected, ready to roll. Send me a message or comment below before it's gone!`;

      document.getElementById("modalBody").innerHTML = `
        <div class="space-y-3">
          <textarea class="w-full h-36 bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm text-gray-200">${script}</textarea>
          <p class="text-xs text-gray-400">💡 Record vertical 9:16 footage walking around the vehicle while speaking this script.</p>
        </div>
      `;
      document.getElementById("actionModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("actionModal").classList.add("hidden");
    }

    // Auto-fetch on boot + Poll every 30 seconds
    document.addEventListener("DOMContentLoaded", () => {
      fetchLiveInventoryFromSupabase();
      setInterval(() => fetchLiveInventoryFromSupabase(false), 30000);
    });
  </script>
</body>
</html>
